name: GovLLM-Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          cd 02-FRAMEWORK
          pip install -r ../requirements.txt
          pip install pytest
      
      - name: Run tests
        run: |
          cd 02-FRAMEWORK
          python -m pytest tests/ -v --tb=short
      
      - name: Run live-fire test (mock)
        run: |
          cd 02-FRAMEWORK
          python -c "
          import sys; sys.path.insert(0, '.')
          from attacks.automated_redteam import RedTeamRunner
          r = RedTeamRunner(mode='mock')
          report = r.run_all_tests('ci-test')
          assert report.overall_resistance >= 80, f'Score too low: {report.overall_resistance}'
          print(f'✅ Live-fire: {report.overall_resistance}% resistance, grade {report.security_grade}')
          "

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t govlm-sentinel:latest .
      
      - name: Smoke test container
        run: |
          docker run -d --name sentinel-test -p 8000:8000 govlm-sentinel:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop sentinel-test
          docker rm sentinel-test
